<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Portfolio of Subin Joseph — Freelance Video Editor. Watch selected works in YouTube, short-form, corporate, documentary, and music video editing." />
  <title>Portfolio — Subin Joseph</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%237c3aed'/><text y='.9em' font-size='65' x='50%25' text-anchor='middle' font-family='system-ui' font-weight='900' fill='white'>SJ</text></svg>" />
  <style>
    /* Fix paths for subpage */
    .nav-logo { href: "../index.html"; }
    
    /* Filter tabs */
    .filter-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 48px;
    }

    .filter-tab {
      padding: 8px 20px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--font-body);
      letter-spacing: 0.02em;
    }

    .filter-tab:hover {
      color: var(--text);
      background: rgba(255,255,255,0.08);
    }

    .filter-tab.active {
      color: #fff;
      background: linear-gradient(135deg, var(--purple) 0%, var(--purple-light) 100%);
      border-color: transparent;
      box-shadow: 0 0 16px var(--purple-glow);
    }

    /* Showreel placeholder */
    .showreel-placeholder {
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      border: 2px dashed rgba(124,58,237,0.3);
      background: linear-gradient(135deg, var(--bg-2) 0%, rgba(124,58,237,0.06) 100%);
      margin-bottom: 80px;
      text-align: center;
      padding: 40px;
    }

    .showreel-placeholder h3 {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .showreel-placeholder p {
      font-size: 14px;
      color: var(--text-dim);
      max-width: 380px;
    }

    .showreel-icon {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: var(--purple-dim);
      border: 1px solid rgba(124,58,237,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
    }
  </style>
</head>
<body>

<script>
  // Fix asset paths for pages/ subdirectory
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.nav-logo').forEach(el => {
      el.href = '../index.html';
    });
    document.querySelectorAll('.nav-link[data-page], .nav-cta[data-page]').forEach(el => {
      const page = el.dataset.page;
      if (page === 'index.html') el.href = '../index.html';
      else el.href = page;
    });
    document.querySelectorAll('.footer-link').forEach(el => {
      if (el.href && el.href.includes('pages/contact')) {
        el.href = 'contact.html';
      }
    });
  });
</script>
<script src="../js/layout.js"></script>

<main class="page-main">
  <div class="container">

    <!-- Page Hero -->
    <div class="page-hero">
      <div class="section-eyebrow fade-in">My work</div>
      <h1 class="display-lg fade-in fade-in-delay-1">Portfolio</h1>
      <p class="text-muted fade-in fade-in-delay-2" style="margin-top:16px; max-width:520px; font-size:16px; line-height:1.75;">
        A selection of edited work across YouTube content, short-form video, corporate films, documentaries, and more.
      </p>
    </div>

    <!-- Showreel Section -->
    <div class="section-eyebrow fade-in">Showreel</div>
    <div class="fade-in fade-in-delay-1" style="width:100%; border-radius:20px; overflow:hidden; margin-bottom:80px; border:1px solid rgba(124,58,237,0.2); background:#0d0d1a; position:relative;">
      <video src="../assets/Watch.mp4" autoplay muted loop playsinline style="width:100%; display:block; border-radius:20px;"></video>
      <div style="position:absolute; bottom:16px; left:20px; display:flex; align-items:center; gap:8px;">
        <span style="width:8px;height:8px;border-radius:50%;background:#a855f7;box-shadow:0 0 8px rgba(168,85,247,0.8);display:inline-block;animation:pulse 1.5s infinite;"></span>
        <span style="font-size:12px;color:rgba(255,255,255,0.6);letter-spacing:0.1em;font-family:monospace;">Smartwatch UI Concept — Motion Graphics</span>
      </div>
    </div>

    <!-- Filter Tabs -->
    <div class="filter-tabs fade-in">
      <button class="filter-tab active" data-filter="all">All</button>
      <button class="filter-tab" data-filter="youtube">YouTube</button>
      <button class="filter-tab" data-filter="shortform">Short-form</button>
      <button class="filter-tab" data-filter="corporate">Corporate</button>
      <button class="filter-tab" data-filter="documentary">Documentary</button>
      <button class="filter-tab" data-filter="music">Music Video</button>
      <button class="filter-tab" data-filter="podcast">Podcast</button>
      <button class="filter-tab" data-filter="motion">Motion Graphics</button>
    </div>

    <!-- Portfolio Grid -->
    <div class="portfolio-grid" id="portfolioGrid">

      <div class="portfolio-empty glass fade-in" style="grid-column:1/-1;">
        <div style="font-size:56px; margin-bottom:16px;">🎞️</div>
        <h3 style="font-family:var(--font-display); font-size:22px; font-weight:700; margin-bottom:12px;">Projects loading in</h3>
        <p>More projects coming soon — <a href="contact.html" style="color:var(--purple-light); font-weight:600;">send me a message</a> to see work samples directly.</p>
      </div>

      <!--
        ── HOW TO ADD A PROJECT ──────────────────────────────
        Copy this block and fill in your details:

        <div class="portfolio-card glass" data-category="youtube">
          <div class="portfolio-thumb">
            <video src="../assets/your-video.mp4" muted loop preload="none"></video>
            <div class="portfolio-overlay">
              <div class="play-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              </div>
            </div>
          </div>
          <div class="portfolio-info">
            <div class="portfolio-tag">YouTube</div>
            <h3 class="portfolio-title">Project Title Here</h3>
            <p class="portfolio-desc">Short description of the project — client, style, what you did.</p>
          </div>
        </div>
        ─────────────────────────────────────────────────────
      -->

    </div>

  </div>
</main>

<script src="../js/main.js"></script>
<script>
  // Filter tabs
  const tabs = document.querySelectorAll('.filter-tab');
  const cards = document.querySelectorAll('.portfolio-card[data-category]');

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');

      const filter = tab.dataset.filter;
      cards.forEach(card => {
        if (filter === 'all' || card.dataset.category === filter) {
          card.style.display = '';
        } else {
          card.style.display = 'none';
        }
      });
    });
  });
</script>
</body>
</html>
