  <style>
    /* Fix paths for subpage */
    .nav-logo { href: "../index.html"; }
    
    /* Filter tabs */
    .filter-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 48px;
    }

    .filter-tab {
      padding: 8px 20px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--font-body);
      letter-spacing: 0.02em;
    }

    .filter-tab:hover {
      color: var(--text);
      background: rgba(255,255,255,0.08);
    }

    .filter-tab.active {
      color: #fff;
      background: linear-gradient(135deg, var(--purple) 0%, var(--purple-light) 100%);
      border-color: transparent;
      box-shadow: 0 0 16px var(--purple-glow);
    }

    /* Showreel placeholder */
    .showreel-placeholder {
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      border: 2px dashed rgba(124,58,237,0.3);
      background: linear-gradient(135deg, var(--bg-2) 0%, rgba(124,58,237,0.06) 100%);
      margin-bottom: 80px;
      text-align: center;
      padding: 40px;
    }

    .showreel-placeholder h3 {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .showreel-placeholder p {
      font-size: 14px;
      color: var(--text-dim);
      max-width: 380px;
    }

    .showreel-icon {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: var(--purple-dim);
      border: 1px solid rgba(124,58,237,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
    }
  </style>
</head>
<body>

<script>
  // Fix asset paths for pages/ subdirectory
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.nav-logo').forEach(el => {
      el.href = '../index.html';
    });
    document.querySelectorAll('.nav-link[data-page], .nav-cta[data-page]').forEach(el => {
      const page = el.dataset.page;
      if (page === 'index.html') el.href = '../index.html';
      else el.href = page;
    });
    document.querySelectorAll('.footer-link').forEach(el => {
      if (el.href && el.href.includes('pages/contact')) {
        el.href = 'contact.html';
      }
    });
  });
</script>
<script src="../js/layout.js"></script>

<script>
  // Filter tabs
  const tabs = document.querySelectorAll('.filter-tab');
  const cards = document.querySelectorAll('.portfolio-card[data-category]');

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');

      const filter = tab.dataset.filter;
      cards.forEach(card => {
        if (filter === 'all' || card.dataset.category === filter) {
          card.style.display = '';
        } else {
          card.style.display = 'none';
        }
      });
    });
  });
</script>

<script>
  // Click-to-play for portfolio video thumbnails
  document.querySelectorAll('.portfolio-thumb').forEach(thumb => {
    const video = thumb.querySelector('video');
    if (!video) return;
    thumb.addEventListener('click', () => {
      if (video.paused) {
        video.play();
        thumb.classList.add('playing');
      } else {
        video.pause();
        thumb.classList.remove('playing');
      }
    });
    video.addEventListener('ended', () => thumb.classList.remove('playing'));
  });
</script>
